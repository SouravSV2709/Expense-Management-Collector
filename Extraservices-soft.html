<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" data-theme="light" font="arial">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra Services New Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {},
            },
            plugins: [daisyui],
            daisyui: {
                themes: ["luxury", "light", "dark","cupcake","emarald", "retro"],
            },
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.0.0/dist/full.css" rel="stylesheet" type="text/css" />
</head>
<body class="flex flex-col min-h-screen">
    
    <!-- Header Section -->
    <header class="p-4 flex items-center justify-around w-full">
        <img src="Aashiyana.png" alt="Society Logo" class="w-10 h-10 m-4">
        <h1 class="text-lg font-bold text-black items-center">Aashiyana Housing Co-operative Society</h1>
        <div class="avatar">
            <div class="w-10 h-10 m-4 rounded-full">
              <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />
            </div>
          </div>
    </header>
    
    <!-- Main Content -->
    <main class="flex justify-center items-center flex-grow mt-2 mb-2">
        <div class="sm:w-96 bg-white p-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 mb-2">
    <!-- Select Operation -->  
    <div class="flex flex-row"> 
        <button class="btn btn-sm btn-ghost btn-outline w-1/2 mx-2">Raise Request</button>
        <button class="btn btn-sm btn-primary w-1/2 mx-2">Log Payment</button>
    </div>

            <div class="flex justify-center items-center">
                <h2 class="text-sm font-bold text-gray-700 mt-2">Raise a new Request</h2>   
            </div>
            <form>
            <label class="block mb-2 text-gray-600">Flat No</label>
            <select class="select select-bordered w-full mb-4 bg-gray-100 hover:bg-gray-200">
                <option disabled selected>Select Flat No</option>
                <option>101</option>
                <option>102</option>
                <option>103</option>
            </select>
            
            <label class="block mb-2 text-gray-600">Name</label>
            <input type="text" placeholder="Auto-filled based on Flat No" class="input input-bordered w-full mb-4 bg-gray-100" disabled>

            <label class="block mb-2 text-gray-600">Mobile Number</label>
            <input type="text" placeholder="Auto-filled based on Flat No" class="input input-bordered w-full mb-4 bg-gray-100" disabled>

            <label class="block mb-2 text-gray-600">Payee Number</label>
            <input type="text" placeholder="Enter Number of the Payee" class="input input-bordered w-full mb-4 bg-gray-100">

            <label class="block mb-2 text-gray-600">Select a Service</label>
            <select class="select select-bordered w-full mb-4 bg-gray-100 hover:bg-gray-200" required>
                <option disabled selected>Select a Service</option>
                <option>Plumbing</option>
                <option>Colouring</option>
                <option>Electrician</option>
            </select>

            <label class="block mb-2 text-gray-600">Assign Technician</label>
            <select class="select select-bordered w-full mb-4 bg-gray-100 hover:bg-gray-200" required>
                <option disabled selected>Assign Technician</option>
                <option>Technician-1</option>
                <option>Technician-2</option>
            </select>
            
            <label class="block mb-2 text-gray-600">Enter Description</label>
            <input type="number" placeholder="Enter details" class="input input-bordered w-full mb-4 bg-gray-100">
            
            <div class="flex flex-col sm:flex-row gap-4 mb-4">
                <div>
                    <label class="block mb-2 text-gray-600 starlabel">Amount</label>
                    <input type="number" placeholder="Amt" class="input input-bordered w-full sm:w-24 bg-gray-100" disabled>
                </div>
                <div>
                    <label class="block mb-2 text-gray-600">Date</label>
                    <input type="date" class="input input-bordered w-full sm:w-36 bg-gray-100" value="2025-02-19">
                </div>
            </div>
                <div class="mx-2 my-2 flex justify-center">          
            <button class="btn btn-primary w-1/2 mx-2">Payment Received</button>
            <button class="btn btn-secondary w-1/2 mx-2">Cancel</button>
                </div>  
            </form>
        </div>
    </main>
    
    <!-- Footer Section -->
    <div class="btm-nav-sm mt-4 mb-4 flex items-center justify-around w-full">
        <button>
            <img src="home.ico" alt="Home" class="w-10 h-10 rounded-full justify-center items-center mx-5">
<span class= "btm-nav-sm-label ">Dashboard</span>    
        </button>
        <button>
            <img src="paymentcollection.ico" alt="Payment" class="w-10 h-10 rounded-full justify-center items-center mx-5">
<span class= "btm-nav-sm-label">Collection</span>    
        </button>
        <button   class="active">
            <img src="Extraservices.ico" alt="Settings" class="w-10 h-10 rounded-full justify-center items-center mx-5">
<span class="btm-nav-sm-label">Services</span>    
        </button>
        <button>
            <img src="Profile.ico" alt="Profile" class="w-10 h-10 rounded-full justify-center items-center mx-5">
<span class= "btm-nav-sm-label">Profile</span>    
        </button>
    </div>

    <!-- Footer Section -->
    <div>     
        <footer class="footer bg-neutral text-white text-center p-4">&copy; 2025 Expense-Manager. All rights reserved.</footer>
    </div>    


    
</body>
</html>
